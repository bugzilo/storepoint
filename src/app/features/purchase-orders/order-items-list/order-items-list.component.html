<div class="order-items-summary">
  <!-- Items count & units sum -->
  <div class="order-items-summary__metric">
    <i stp-icon name="package" class="icon--xs text-primary-c"></i>
    <span class="order-items-summary__text">
      <strong>{{ totalItems() }}</strong> {{ totalItems() === 1 ? 'producto' : 'productos' }}
      <span class="order-items-summary__bullet" aria-hidden="true">·</span>
      <strong>{{ totalUnits() }}</strong> {{ totalUnits() === 1 ? 'unidad' : 'unidades' }}
    </span>
  </div>

  <!-- Relevant operational tags: Delivery date & Payment terms -->
  <div class="order-items-summary__tags">
    @if (expectedDeliveryDate()) {
      <span class="order-items-summary__tag order-items-summary__tag--delivery" [title]="'Fecha estimada de entrega: ' + (expectedDeliveryDate() | date:'dd/MM/yyyy')">
        <i stp-icon name="calendar-check" class="icon--xs"></i>
        {{ expectedDeliveryDate() | date:'dd/MM' }}
      </span>
    }
    @if (paymentTerms()) {
      <span class="order-items-summary__tag order-items-summary__tag--terms" [title]="'Condición de pago: ' + paymentTerms()">
        <i stp-icon name="credit-card" class="icon--xs"></i>
        {{ paymentTerms() }}
      </span>
    }
  </div>
</div>
